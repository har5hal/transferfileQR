<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera Test</title>
</head>

<body style="background:#111;color:white;font-family:sans-serif">

<h2>Camera Test</h2>

<video
    id="video"
    autoplay
    playsinline
    muted
    style="width:100%; max-width:600px; background:#000;">
</video>

<div id="status">Starting...</div>

<script>
const video = document.getElementById("video");
const status = document.getElementById("status");

function log(message) {
    console.log(message);
    status.textContent = message;
}

async function startCamera() {

    log("1. Checking camera API...");

    if (!navigator.mediaDevices) {
        log("ERROR: navigator.mediaDevices is unavailable");
        return;
    }

    if (!navigator.mediaDevices.getUserMedia) {
        log("ERROR: getUserMedia is unavailable");
        return;
    }

    log("2. Requesting camera...");

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });

        log("3. Camera stream received");

        console.log("Stream:", stream);
        console.log("Tracks:", stream.getVideoTracks());

        video.srcObject = stream;

        log("4. Video source attached");

        video.onloadedmetadata = async () => {

            log(
                "5. Video metadata loaded: " +
                video.videoWidth +
                " × " +
                video.videoHeight
            );

            try {
                await video.play();

                log(
                    "6. CAMERA WORKING: " +
                    video.videoWidth +
                    " × " +
                    video.videoHeight
                );

            } catch (e) {

                log(
                    "PLAY ERROR: " +
                    e.name +
                    " - " +
                    e.message
                );

                console.error(e);
            }
        };

    } catch (e) {

        log(
            "CAMERA ERROR: " +
            e.name +
            " - " +
            e.message
        );

        console.error(
            "getUserMedia error:",
            e
        );
    }
}

startCamera();
</script>


</body>
</html>
