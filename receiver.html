<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Offline QR File Receiver</title>

<script src="./jsQR.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #08111f;
    color: #f8fafc;

    font-family: Arial, sans-serif;
}

.app {
    width: min(900px, 96vw);
    margin: auto;
    padding: 15px;
}

.card {
    background: #111c2e;

    border: 1px solid #263750;

    border-radius: 18px;

    padding: 18px;
}

h1 {
    text-align: center;
    margin: 0;
}

.subtitle {
    text-align: center;
    color: #94a3b8;
}

video {
    display: block;

    width: 100%;

    max-height: 65vh;

    object-fit: cover;

    background: black;

    border-radius: 12px;

    transform: none;
}

canvas {
    display: none;
}

.controls {
    text-align: center;

    margin: 12px 0;
}

button {
    padding: 12px 20px;

    border: 0;

    border-radius: 8px;

    background: #2563eb;

    color: white;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    margin: 4px;
}

button.stop {
    background: #dc2626;
}

button.download {
    background: #16a34a;
}

button:disabled {
    opacity: .45;

    cursor: not-allowed;
}

.status {
    margin-top: 12px;

    padding: 12px;

    background: #0b1525;

    border-radius: 8px;

    text-align: center;

    white-space: pre-wrap;
}

.success {
    color: #4ade80;
}

.error {
    color: #f87171;
}

.progress {
    height: 22px;

    margin-top: 12px;

    background: #334155;

    border-radius: 20px;

    overflow: hidden;
}

#progressBar {
    height: 100%;

    width: 0%;

    background: #22c55e;
}

.info {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    margin-top: 12px;
}

.box {
    background: #0b1525;

    padding: 10px;

    border-radius: 8px;

    text-align: center;
}

.value {
    display: block;

    font-weight: bold;

    overflow-wrap: anywhere;
}

.label {
    color: #94a3b8;

    font-size: 12px;
}

.missing-area {
    margin-top: 15px;

    background: #0b1525;

    border-radius: 10px;

    padding: 15px;
}

#missingList {
    width: 100%;

    min-height: 100px;

    background: #111c2e;

    border: 1px solid #334155;

    color: #f8fafc;

    border-radius: 8px;

    padding: 10px;

    font-family: monospace;

    resize: vertical;
}

.warning {
    color: #fbbf24;
}

@media(max-width:600px) {

    .info {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 10px;
    }
}
</style>
</head>

<body>

<div class="app">

<div class="card">

<h1>📥 Offline QR File Receiver</h1>

<p class="subtitle">
Scan QR packets using the rear camera
</p>


<!-- CAMERA -->

<video
    id="video"
    autoplay
    playsinline>
</video>

<canvas id="canvas"></canvas>


<div class="controls">

<button id="startButton">
Start Camera
</button>

<button
    id="stopButton"
    class="stop"
    disabled>
Stop Camera
</button>

</div>


<!-- PROGRESS -->

<div class="progress">

<div id="progressBar"></div>

</div>


<div
    id="status"
    class="status">

Press Start Camera.

</div>


<!-- INFORMATION -->

<div class="info">

<div class="box">

<span
    id="transferId"
    class="value">

—

</span>

<span class="label">
Transfer ID
</span>

</div>


<div class="box">

<span
    id="received"
    class="value">

0

</span>

<span class="label">
Received
</span>

</div>


<div class="box">

<span
    id="total"
    class="value">

—

</span>

<span class="label">
Total
</span>

</div>

</div>


<div class="info">

<div class="box">

<span
    id="percentage"
    class="value">

0%

</span>

<span class="label">
Complete
</span>

</div>


<div class="box">

<span
    id="duplicate"
    class="value">

0

</span>

<span class="label">
Duplicates
</span>

</div>


<div class="box">

<span
    id="filename"
    class="value">

—

</span>

<span class="label">
File
</span>

</div>

</div>


<!-- MISSING PACKETS -->

<div class="missing-area">

<strong>
Missing Packets
</strong>

<p class="warning">
Copy this list to the sender's
"Manual Missing Packet Recovery" box.
</p>


<textarea
    id="missingList"
    readonly
    placeholder="No missing packets yet.">
</textarea>


<div class="controls">

<button
    id="copyMissingButton">

Copy Missing List

</button>

<button
    id="downloadButton"
    class="download"
    disabled>

Download File

</button>

</div>

</div>


</div>

</div>


<script>

/*
=========================================================
OFFLINE QR RECEIVER
=========================================================

EXPECTED PACKET:

QRF3|
TRANSFER_ID|
PACKET_ID|
TOTAL_PACKETS|
FILENAME|
FILE_SIZE|
BASE64_DATA


The receiver does NOT treat each packet as a file.

All packets are pieces of ONE selected file.

Example:

MyFolder.zip

    packet 0
    packet 1
    packet 2
    ...
    packet 579

Only when ALL packets exist is the ZIP reconstructed.
=========================================================
*/


const video =
    document.getElementById(
        "video"
    );

const canvas =
    document.getElementById(
        "canvas"
    );

const ctx =
    canvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );


const startButton =
    document.getElementById(
        "startButton"
    );

const stopButton =
    document.getElementById(
        "stopButton"
    );

const status =
    document.getElementById(
        "status"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );

const transferIdElement =
    document.getElementById(
        "transferId"
    );

const receivedElement =
    document.getElementById(
        "received"
    );

const totalElement =
    document.getElementById(
        "total"
    );

const percentageElement =
    document.getElementById(
        "percentage"
    );

const duplicateElement =
    document.getElementById(
        "duplicate"
    );

const filenameElement =
    document.getElementById(
        "filename"
    );

const missingList =
    document.getElementById(
        "missingList"
    );

const copyMissingButton =
    document.getElementById(
        "copyMissingButton"
    );

const downloadButton =
    document.getElementById(
        "downloadButton"
    );


/*
=========================================================
STATE
=========================================================
*/

let stream = null;

let scanning = false;

let animationFrame = null;


/*
Transfer information.
*/

let transferId = null;

let totalPackets = 0;

let filename = "";

let expectedFileSize = 0;


/*
Array containing packet data.

packets[0] = packet 0
packets[1] = packet 1

etc.
*/

let packets = [];


/*
Set makes duplicate detection fast.
*/

let receivedIds =
    new Set();


let duplicateCount = 0;


/*
Prevent processing the exact same QR
hundreds of times while it remains
on screen.
*/

let lastDecodedText = "";

let lastDecodedTime = 0;


/*
=========================================================
START CAMERA
=========================================================
*/

startButton.addEventListener(
    "click",
    startCamera
);


async function startCamera() {

    if (
        typeof jsQR !==
        "function"
    ) {

        status.className =
            "status error";

        status.textContent =
            "jsQR was not loaded.\n\n" +
            "Make sure jsQR.js is available.";

        return;
    }


    stopCamera();


    try {

        /*
         * environment = rear camera.

         * This works on modern Android/iPhone
         * browsers when camera permission is granted.
         */

        stream =
            await navigator.mediaDevices.getUserMedia(
                {
                    video: {
                        facingMode: {
                            ideal: "environment"
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }
                    },

                    audio: false
                }
            );


        video.srcObject =
            stream;


        await video.play();


        scanning = true;


        startButton.disabled =
            true;

        stopButton.disabled =
            false;


        status.className =
            "status";

        status.textContent =
            "Camera running.\n\n" +
            "Point the rear camera at the sender QR.";


        scanLoop();

    }
    catch(error) {

        console.error(
            error
        );


        status.className =
            "status error";


        status.textContent =
            "CAMERA ERROR: " +
            error.name +
            " - " +
            error.message;

    }
}


/*
=========================================================
STOP CAMERA
=========================================================
*/

stopButton.addEventListener(
    "click",
    stopCamera
);


function stopCamera() {

    scanning = false;


    if (animationFrame) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;
    }


    if (stream) {

        stream.getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        stream = null;
    }


    video.srcObject =
        null;


    startButton.disabled =
        false;

    stopButton.disabled =
        true;
}


/*
=========================================================
SCAN LOOP
=========================================================
*/

function scanLoop() {

    if (!scanning) {
        return;
    }


    if (
        video.readyState >=
        HTMLMediaElement.HAVE_CURRENT_DATA
    ) {

        /*
         * Use the actual camera dimensions.
         */

        const width =
            video.videoWidth;

        const height =
            video.videoHeight;


        if (
            width > 0 &&
            height > 0
        ) {

            canvas.width =
                width;

            canvas.height =
                height;


            ctx.drawImage(
                video,
                0,
                0,
                width,
                height
            );


            const imageData =
                ctx.getImageData(
                    0,
                    0,
                    width,
                    height
                );


            const code =
                jsQR(
                    imageData.data,
                    width,
                    height,
                    {
                        inversionAttempts:
                            "attemptBoth"
                    }
                );


            if (code) {

                processQR(
                    code.data
                );
            }
        }
    }


    animationFrame =
        requestAnimationFrame(
            scanLoop
        );
}


/*
=========================================================
PROCESS QR
=========================================================
*/

function processQR(
    text
) {

    const now =
        Date.now();


    /*
     * Don't repeatedly process exactly
     * the same visible QR immediately.

     * Wait 250 ms.

     * This still allows the same packet
     * to be scanned again if necessary.
     */

    if (
        text === lastDecodedText &&
        now - lastDecodedTime < 250
    ) {

        return;
    }


    lastDecodedText =
        text;

    lastDecodedTime =
        now;


    if (
        !text.startsWith(
            "QRF3|"
        )
    ) {

        return;
    }


    parsePacket(
        text
    );
}


/*
=========================================================
PARSE PACKET
=========================================================
*/

function parsePacket(
    text
) {

    const parts =
        text.split("|");


    /*
     * Filename and Base64 are the last
     * two fields.

     * Base64 itself does not contain "|",
     * so split is safe here.
     */

    if (
        parts.length < 7
    ) {

        return;
    }


    const version =
        parts[0];

    const incomingTransferId =
        parts[1];

    const packetId =
        Number(parts[2]);

    const incomingTotal =
        Number(parts[3]);

    const incomingFilename =
        decodeURIComponent(
            parts[4]
        );

    const incomingFileSize =
        Number(parts[5]);

    const base64 =
        parts.slice(
            6
        ).join("|");


    if (
        version !==
        "QRF3"
    ) {

        return;
    }


    if (
        !Number.isInteger(
            packetId
        )
    ) {

        return;
    }


    if (
        !Number.isInteger(
            incomingTotal
        ) ||
        incomingTotal <= 0
    ) {

        return;
    }


    /*
     * FIRST PACKET

     * Establish transfer metadata.
     */

    if (
        transferId === null
    ) {

        transferId =
            incomingTransferId;

        totalPackets =
            incomingTotal;

        filename =
            incomingFilename;

        expectedFileSize =
            incomingFileSize;


        packets =
            new Array(
                totalPackets
            );


        receivedIds =
            new Set();


        transferIdElement.textContent =
            transferId;

        totalElement.textContent =
            totalPackets;

        filenameElement.textContent =
            filename;


        status.textContent =
            "Transfer detected.\n\n" +
            "Transfer ID: " +
            transferId;
    }


    /*
     * Reject packets belonging to another
     * transfer.

     * This is important if another QR
     * appears in front of the camera.
     */

    if (
        incomingTransferId !==
        transferId
    ) {

        return;
    }


    /*
     * Reject inconsistent packet counts.
     */

    if (
        incomingTotal !==
        totalPackets
    ) {

        return;
    }


    /*
     * Validate packet ID.
     */

    if (
        packetId < 0 ||
        packetId >= totalPackets
    ) {

        return;
    }


    /*
     * DUPLICATE

     * The receiver already has this packet.
     */

    if (
        receivedIds.has(
            packetId
        )
    ) {

        duplicateCount++;

        duplicateElement.textContent =
            duplicateCount;

        return;
    }


    /*
     * Decode Base64.
     */

    try {

        const bytes =
            base64ToBytes(
                base64
            );


        packets[packetId] =
            bytes;


        receivedIds.add(
            packetId
        );


        updateProgress();


    }
    catch(error) {

        console.error(
            "Packet decode error:",
            error
        );
    }
}


/*
=========================================================
PROGRESS
=========================================================
*/

function updateProgress() {

    const received =
        receivedIds.size;


    const percentage =
        (
            received /
            totalPackets
        ) *
        100;


    receivedElement.textContent =
        received.toLocaleString();


    percentageElement.textContent =
        percentage.toFixed(1) +
        "%";


    progressBar.style.width =
        percentage + "%";


    updateMissingList();


    if (
        received ===
        totalPackets
    ) {

        status.className =
            "status success";


        status.textContent =
            "✓ 100% COMPLETE\n\n" +
            "All packets have been received.\n" +
            "The file can now be downloaded.";


        downloadButton.disabled =
            false;


        missingList.value =
            "NONE — all packets received.";

    }
    else {

        status.className =
            "status";


        status.textContent =
            "Receiving...\n\n" +
            received.toLocaleString() +
            " / " +
            totalPackets.toLocaleString() +
            " packets received.";

        downloadButton.disabled =
            true;
    }
}


/*
=========================================================
MISSING PACKETS
=========================================================
*/

function updateMissingList() {

    if (
        totalPackets <= 0
    ) {

        missingList.value =
            "";

        return;
    }


    const missing = [];


    for (
        let i = 0;
        i < totalPackets;
        i++
    ) {

        if (
            !receivedIds.has(i)
        ) {

            missing.push(i);
        }
    }


    /*
     * Convert individual numbers into
     * compact ranges.

     * Example:

       1,2,3,4,7,8,10

       becomes:

       1-4,7-8,10
    */

    missingList.value =
        compressRanges(
            missing
        );
}


/*
=========================================================
COMPRESS RANGES
=========================================================
*/

function compressRanges(
    numbers
) {

    if (
        numbers.length === 0
    ) {

        return "";
    }


    const ranges = [];

    let start =
        numbers[0];

    let previous =
        numbers[0];


    for (
        let i = 1;
        i < numbers.length;
        i++
    ) {

        const current =
            numbers[i];


        if (
            current ===
            previous + 1
        ) {

            previous =
                current;

        }
        else {

            if (
                start ===
                previous
            ) {

                ranges.push(
                    String(start)
                );

            }
            else {

                ranges.push(
                    start +
                    "-" +
                    previous
                );
            }


            start =
                current;

            previous =
                current;
        }
    }


    if (
        start ===
        previous
    ) {

        ranges.push(
            String(start)
        );

    }
    else {

        ranges.push(
            start +
            "-" +
            previous
        );
    }


    return ranges.join(
        ","
    );
}


/*
=========================================================
COPY MISSING LIST
=========================================================
*/

copyMissingButton.addEventListener(
    "click",
    async function() {

        const text =
            missingList.value;


        if (!text) {
            return;
        }


        try {

            await navigator.clipboard.writeText(
                text
            );


            status.textContent =
                "Missing packet list copied.";

        }
        catch(error) {

            /*
             * Clipboard permission may not
             * be available in some browsers.

             * The list is still visible and
             * can be selected manually.
             */

            missingList.focus();

            missingList.select();
        }
    }
);


/*
=========================================================
DOWNLOAD
=========================================================
*/

downloadButton.addEventListener(
    "click",
    downloadFile
);


function downloadFile() {

    if (
        receivedIds.size !==
        totalPackets
    ) {

        alert(
            "The file is not complete yet."
        );

        return;
    }


    try {

        /*
         * Reassemble packets IN PACKET ID ORDER.

         * This is critical.
         */

        const blobParts = [];


        for (
            let i = 0;
            i < totalPackets;
            i++
        ) {

            if (
                !packets[i]
            ) {

                alert(
                    "Packet " +
                    i +
                    " is missing."
                );

                return;
            }


            blobParts.push(
                packets[i]
            );
        }


        const blob =
            new Blob(
                blobParts,
                {
                    type:
                        "application/octet-stream"
                }
            );


        /*
         * Optional safety check.
         */

        if (
            expectedFileSize > 0 &&
            blob.size !==
            expectedFileSize
        ) {

            alert(
                "File size verification failed.\n\n" +
                "Expected: " +
                expectedFileSize +
                " bytes\n" +
                "Received: " +
                blob.size +
                " bytes"
            );

            return;
        }


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;

        link.download =
            filename ||
            "received-file";


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        setTimeout(
            () => {
                URL.revokeObjectURL(
                    url
                );
            },
            1000
        );


        status.className =
            "status success";


        status.textContent =
            "✓ File download started.\n\n" +
            filename;

    }
    catch(error) {

        console.error(
            error
        );


        status.className =
            "status error";


        status.textContent =
            "Could not create the downloaded file.";
    }
}


/*
=========================================================
BASE64 → BYTES
=========================================================
*/

function base64ToBytes(
    base64
) {

    const binary =
        atob(base64);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);
    }


    return bytes;
}


/*
=========================================================
CLEANUP
=========================================================
*/

window.addEventListener(
    "pagehide",
    stopCamera
);

</script>

</body>
</html>
