<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Offline QR File Receiver</title>

<script src="./jsQR.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #07111f;

    color: #f8fafc;

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.app {
    width: min(900px, 96vw);
    margin: auto;
    padding: 12px;
}

.card {
    background: #111c2e;

    border: 1px solid #263750;

    border-radius: 18px;

    padding: 16px;
}

h1 {
    margin: 0;
    text-align: center;
}

.subtitle {
    text-align: center;
    color: #94a3b8;
    margin: 5px 0 14px;
}


/* =====================================================
   CAMERA
===================================================== */

.camera {
    position: relative;

    width: 100%;

    aspect-ratio: 4 / 3;

    background: #000;

    border-radius: 14px;

    overflow: hidden;
}

#video {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    background: #000;
}


/* =====================================================
   SCAN GUIDE
===================================================== */

.scan-box {

    position: absolute;

    width: min(72%, 430px);

    aspect-ratio: 1;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border:
        3px solid #22c55e;

    border-radius: 14px;

    pointer-events: none;

    box-shadow:
        0 0 0 9999px
        rgba(0, 0, 0, .22);
}


/* =====================================================
   BUTTONS
===================================================== */

.controls {
    text-align: center;
    margin: 12px 0;
}

button {
    border: 0;

    border-radius: 9px;

    padding: 12px 22px;

    margin: 4px;

    font-size: 15px;

    font-weight: 700;

    color: white;

    background: #2563eb;

    cursor: pointer;
}

button.stop {
    background: #dc2626;
}

button.download {
    background: #16a34a;

    width:
        calc(100% - 8px);

    margin-top: 10px;

    font-size: 17px;
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}


/* =====================================================
   STATUS
===================================================== */

.status {
    margin-top: 10px;

    padding: 12px;

    border-radius: 9px;

    text-align: center;

    background: #0b1525;

    color: #cbd5e1;

    white-space: pre-wrap;
}

.status.ok {
    color: #4ade80;
}

.status.error {
    color: #f87171;
}


/* =====================================================
   PROGRESS
===================================================== */

.progress {
    height: 24px;

    margin-top: 14px;

    background: #334155;

    border-radius: 20px;

    overflow: hidden;
}

#progressBar {
    width: 0%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            #22c55e,
            #16a34a
        );

    transition:
        width .15s;
}


/* =====================================================
   INFO
===================================================== */

.info {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    margin-top: 10px;
}

.box {
    padding: 10px;

    text-align: center;

    background: #0b1525;

    border-radius: 8px;
}

.value {
    display: block;

    font-weight: 800;

    overflow-wrap: anywhere;
}

.label {
    display: block;

    margin-top: 3px;

    font-size: 12px;

    color: #94a3b8;
}

.transfer-id {
    color: #60a5fa;

    font-family: monospace;
}


/* =====================================================
   MISSING PACKETS
===================================================== */

.missing-box {

    margin-top: 10px;

    padding: 12px;

    background: #0b1525;

    border-radius: 9px;

    font-family: monospace;

    font-size: 13px;

    line-height: 1.5;

    max-height: 180px;

    overflow: auto;

    word-break: break-word;
}


@media(max-width:600px) {

    .card {
        padding: 10px;
    }

    .info {
        grid-template-columns: 1fr;
    }
}

</style>

</head>


<body>

<div class="app">

<div class="card">

<h1>📥 Offline QR File Receiver</h1>

<p class="subtitle">
Android + iPhone • Rear Camera • QRF2 Resume
</p>


<!-- =================================================
     CAMERA
================================================== -->

<div class="camera">

<video
    id="video"
    autoplay
    playsinline
    muted>
</video>

<div class="scan-box"></div>

</div>


<div class="controls">

<button id="startButton">
📷 Start Rear Camera
</button>

    id="stopButton"

Stop
</button>

</div>


<!-- =================================================

================================================== -->

<div
    id="status"

Ready.

</div>

================================================== -->

<div class="progress">

<div id="progressBar"></div>

</div>

================================================== -->

<div class="info">

Missing packets will appear here.

================================================== -->

<div class="controls">

<button

    disabled>

⬇ Download File

</button>

</div>


</div>

<script>

/*
=========================================================
QRF2 RECEIVER
=========================================================

Packet:

QRF2|TRANSFER_ID|PACKET_ID|TOTAL_PACKETS|FILENAME|FILE_SIZE|BASE64

The receiver:

1. Detects Transfer ID.
2. Creates a packet map.
3. Stores packets by packet ID.
4. Ignores duplicates.
5. Detects missing packet IDs.
6. Accepts retransmissions.
7. Rebuilds only when every packet exists.
8. Verifies the final byte count.
9. Enables download only after verification.
=========================================================
*/


const video =
    document.getElementById(
        "video"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const stopButton =
    document.getElementById(
        "stopButton"
    );

const downloadButton =
    document.getElementById(
        "downloadButton"
    );

const statusElement =
    document.getElementById(
        "status"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );

const fileNameElement =
    document.getElementById(
        "fileName"
    );

const receivedElement =
    document.getElementById(
        "received"
    );

const totalElement =
    document.getElementById(
        "total"
    );

const fileSizeElement =
    document.getElementById(
        "fileSize"
    );

const missingElement =
    document.getElementById(
        "missing"
    );

const percentElement =
    document.getElementById(
        "percent"
    );

const transferIdElement =
    document.getElementById(
        "transferId"
    );

const lastPacketElement =
    document.getElementById(
        "lastPacket"
    );

const scanCountElement =
    document.getElementById(
        "scanCount"
    );

const missingBox =
    document.getElementById(
        "missingBox"
    );


/* =====================================================
   CAMERA
===================================================== */

let stream = null;

let scanning = false;

let animationFrame = null;


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.createElement(
        "canvas"
    );

const ctx =
    canvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );


/* =====================================================
   TRANSFER
===================================================== */

let transfer = null;


/*
 * Map:
 *
 * packet ID → Uint8Array
 */

const packets =
    new Map();


/*
 * Completed file.
 */

let completedFileBlob = null;

let completedFileName = null;


/*
 * Used to avoid processing the exact same
 * QR many times in consecutive camera frames.
 */

let lastQR = "";

let lastQRTime = 0;


/*
 * Count successfully decoded packets.
 */

let scanCount = 0;


/* =====================================================
   ENVIRONMENT CHECK
===================================================== */

function checkCameraEnvironment() {

    if (
        !window.isSecureContext &&
        location.hostname !==
            "localhost" &&
        location.hostname !==
            "127.0.0.1"
    ) {

        showError(
            "Camera requires HTTPS.\n\n" +
            "Open receiver.html using your " +
            "GitHub Pages HTTPS address."
        );

        return false;
    }


    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        showError(
            "This browser does not provide camera access."
        );

        return false;
    }


    if (
        typeof jsQR ===
        "undefined"
    ) {

        showError(
            "jsQR.js was not loaded.\n\n" +
            "Put jsQR.js beside receiver.html."
        );

        return false;
    }


    return true;
}


/* =====================================================
   START CAMERA
===================================================== */

startButton.addEventListener(
    "click",
    startCamera
);


async function startCamera() {

    if (
        !checkCameraEnvironment()
    ) {

        return;
    }


    try {

        setStatus(
            "Requesting rear camera..."
        );


        const constraints = {

            video: {

                facingMode: {
                    ideal:
                        "environment"
                },

                width: {
                    ideal: 1280
                },

                height: {
                    ideal: 720
                }
            },

            audio: false
        };


        stream =
            await navigator
                .mediaDevices
                .getUserMedia(
                    constraints
                );


        video.srcObject =
            stream;


        /*
         * Important for iPhone.
         */

        video.setAttribute(
            "playsinline",
            ""
        );

        video.setAttribute(
            "autoplay",
            ""
        );

        video.muted = true;


        try {

            await video.play();

        }
        catch(error) {

            console.log(
                "Video play:",
                error
            );
        }


        scanning = true;

        startButton.disabled =
            true;

        stopButton.disabled =
            false;


        setStatus(
            "✓ Rear camera active.\n\n" +
            "Point the camera at the sender QR."
        );


        scanLoop();

    }
    catch(error) {

        console.error(
            "Camera error:",
            error
        );


        handleCameraError(
            error
        );
    }
}


/* =====================================================
   CAMERA ERROR
===================================================== */

function handleCameraError(
    error
) {

    let message =
        "Camera access failed.";


    if (
        error.name ===
        "NotAllowedError"
    ) {

        message =
            "Camera permission was denied.\n\n" +
            "Allow camera access for this site " +
            "and reload the page.";

    }
    else if (
        error.name ===
        "NotReadableError"
    ) {

        message =
            "The camera could not be started.\n\n" +
            "Another tab or application may already " +
            "be using the camera.";

    }
    else if (
        error.name ===
        "NotFoundError"
    ) {

        message =
            "No camera was found.";

    }
    else if (
        error.name ===
        "SecurityError"
    ) {

        message =
            "Camera access was blocked.\n\n" +
            "Make sure receiver.html is opened " +
            "using HTTPS.";

    }
    else {

        message =
            "Camera error:\n\n" +
            error.name +
            "\n" +
            error.message;
    }


    showError(
        message
    );
}


/* =====================================================
   SCAN LOOP
===================================================== */

function scanLoop() {

    if (!scanning) {
        return;
    }


    if (
        video.readyState >=
        HTMLMediaElement
            .HAVE_ENOUGH_DATA &&
        video.videoWidth > 0 &&
        video.videoHeight > 0
    ) {


        if (
            canvas.width !==
                video.videoWidth ||
            canvas.height !==
                video.videoHeight
        ) {

            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;
        }


        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );


        try {

            const image =
                ctx.getImageData(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


            const result =
                jsQR(
                    image.data,
                    image.width,
                    image.height,
                    {
                        inversionAttempts:
                            "attemptBoth"
                    }
                );


            if (result) {

                processQR(
                    result.data
                );
            }

        }
        catch(error) {

            console.error(
                "QR decoder error:",
                error
            );
        }
    }


    animationFrame =
        requestAnimationFrame(
            scanLoop
        );
}


/* =====================================================
   PROCESS QRF2
===================================================== */

function processQR(
    data
) {


    /*
     * Only accept our protocol.
     */

    if (
        !data.startsWith(
            "QRF2|"
        )
    ) {

        return;
    }


    /*
     * Avoid processing the exact same QR
     * repeatedly while it remains on screen.
     */

    const now =
        Date.now();


    if (
        data === lastQR &&
        now - lastQRTime < 120
    ) {

        return;
    }


    lastQR =
        data;

    lastQRTime =
        now;


    /*
     * Parse:

     * QRF2
     * Transfer ID
     * Packet ID
     * Total
     * Filename
     * File Size
     * Base64
     */

    const parts =
        data.split("|");


    /*
     * We need at least 7 fields.

     * Base64 itself does not contain '|',
     * so this is safe for our protocol.
     */

    if (
        parts.length < 7
    ) {

        return;
    }


    const protocol =
        parts[0];


    const transferId =
        parts[1];


    const packetId =
        Number(
            parts[2]
        );


    const totalPackets =
        Number(
            parts[3]
        );


    const encodedFilename =
        parts[4];


    const originalFileSize =
        Number(
            parts[5]
        );


    const base64 =
        parts.slice(
            6
        ).join("|");


    /*
     * Validate protocol.
     */

    if (
        protocol !==
        "QRF2"
    ) {

        return;
    }


    /*
     * Validate transfer ID.
     */

    if (
        !transferId ||
        transferId.length >
            64
    ) {

        return;
    }


    /*
     * Validate packet.
     */

    if (
        !Number.isInteger(
            packetId
        ) ||
        packetId < 0
    ) {

        return;
    }


    if (
        !Number.isInteger(
            totalPackets
        ) ||
        totalPackets <= 0
    ) {

        return;
    }


    if (
        packetId >=
        totalPackets
    ) {

        return;
    }


    if (
        !Number.isFinite(
            originalFileSize
        ) ||
        originalFileSize < 0
    ) {

        return;
    }


    /*
     * Decode filename.
     */

    let filename;


    try {

        filename =
            decodeURIComponent(
                encodedFilename
            );

    }
    catch {

        filename =
            encodedFilename;
    }


    /*
     * Detect NEW transfer.

     * A different Transfer ID means
     * a different transfer.
     */

    if (
        !transfer ||
        transfer.id !==
            transferId
    ) {


        transfer = {

            id:
                transferId,

            filename:
                filename,

            fileSize:
                originalFileSize,

            totalPackets:
                totalPackets

        };


        /*
         * Clear packets from old transfer.
         */

        packets.clear();


        completedFileBlob =
            null;

        completedFileName =
            null;


        downloadButton.disabled =
            true;


        /*
         * Reset UI.
         */

        transferIdElement.textContent =
            transferId;

        fileNameElement.textContent =
            filename;

        fileSizeElement.textContent =
            formatBytes(
                originalFileSize
            );

        totalElement.textContent =
            totalPackets;

        receivedElement.textContent =
            "0";

        missingElement.textContent =
            totalPackets;

        percentElement.textContent =
            "0%";

        progressBar.style.width =
            "0%";

        missingBox.textContent =
            "Missing packets will appear here.";


        setStatus(
            "New transfer detected.\n\n" +
            "Transfer ID: " +
            transferId +
            "\n\n" +
            filename
        );
    }


    /*
     * Safety check.

     * If a packet from another transfer somehow
     * appears, ignore it.
     */

    if (
        transfer.id !==
        transferId
    ) {

        return;
    }


    /*
     * Check metadata consistency.

     * A corrupted/mismatched transfer packet
     * should not modify the current transfer.
     */

    if (
        transfer.totalPackets !==
            totalPackets ||
        transfer.fileSize !==
            originalFileSize
    ) {

        return;
    }


    /*
     * If already received, ignore duplicate.

     * This is what makes retransmission safe.
     */

    if (
        packets.has(
            packetId
        )
    ) {

        lastPacketElement.textContent =
            packetId;

        return;
    }


    /*
     * Decode payload.
     */

    let bytes;


    try {

        bytes =
            base64ToBytes(
                base64
            );

    }
    catch(error) {

        console.error(
            "Invalid Base64:",
            error
        );

        return;
    }


    /*
     * Store packet.

     * This is the critical part for
     * missing-packet recovery.
     */

    packets.set(
        packetId,
        bytes
    );


    scanCount++;


    scanCountElement.textContent =
        scanCount.toLocaleString();


    lastPacketElement.textContent =
        packetId;


    /*
     * Update progress and missing list.
     */

    updateProgress();


    /*
     * Check whether every packet has
     * arrived.
     */

    if (
        packets.size ===
        transfer.totalPackets
    ) {

        verifyAndBuildFile();
    }
}


/* =====================================================
   FIND MISSING PACKETS
===================================================== */

function getMissingPackets() {

    if (!transfer) {
        return [];
    }


    const missing = [];


    for (
        let i = 0;
        i < transfer.totalPackets;
        i++
    ) {

        if (
            !packets.has(i)
        ) {

            missing.push(i);
        }
    }


    return missing;
}


/* =====================================================
   UPDATE PROGRESS
===================================================== */

function updateProgress() {

    if (!transfer) {
        return;
    }


    const received =
        packets.size;


    const total =
        transfer.totalPackets;


    const missingList =
        getMissingPackets();


    const missingCount =
        missingList.length;


    const percentage =
        Math.floor(
            received /
            total *
            100
        );


    receivedElement.textContent =
        received.toLocaleString();


    totalElement.textContent =
        total.toLocaleString();


    missingElement.textContent =
        missingCount.toLocaleString();


    percentElement.textContent =
        percentage + "%";


    progressBar.style.width =
        percentage + "%";


    /*
     * Display missing packet IDs.

     * Limit the visible list so that a huge
     * transfer doesn't make the page unusable.
     */

    if (
        missingList.length === 0
    ) {

        missingBox.textContent =
            "✓ No missing packets.";

    }
    else {

        const DISPLAY_LIMIT =
            500;


        let text =
            "Missing packet IDs:\n\n";


        if (
            missingList.length <=
            DISPLAY_LIMIT
        ) {

            text +=
                missingList.join(
                    ", "
                );

        }
        else {

            text +=
                missingList
                    .slice(
                        0,
                        DISPLAY_LIMIT
                    )
                    .join(
                        ", "
                    );


            text +=
                "\n\n... +" +
                (
                    missingList.length -
                    DISPLAY_LIMIT
                ) +
                " more";
        }


        missingBox.textContent =
            text;
    }


    /*
     * Don't show "complete" until
     * verification actually succeeds.
     */

    if (
        missingCount > 0
    ) {

        setStatus(
            "Receiving transfer...\n\n" +
            "ID: " +
            transfer.id +
            "\n\n" +
            received.toLocaleString() +
            " / " +
            total.toLocaleString() +
            " packets\n\n" +
            "Missing: " +
            missingCount.toLocaleString() +
            "\n\n" +
            "Start the sender again to retransmit " +
            "the missing packets."
        );
    }
}


/* =====================================================
   VERIFY AND BUILD
===================================================== */

function verifyAndBuildFile() {

    if (!transfer) {
        return;
    }


    /*
     * ALWAYS check actual packet IDs.

     * packets.size alone isn't sufficient.
     */

    const missing =
        getMissingPackets();


    if (
        missing.length > 0
    ) {

        updateProgress();

        return;
    }


    setStatus(
        "All packets received.\n\n" +
        "Verifying file..."
    );


    /*
     * Calculate reconstructed size.
     */

    let totalBytes = 0;


    for (
        let i = 0;
        i < transfer.totalPackets;
        i++
    ) {

        const packet =
            packets.get(i);


        if (!packet) {

            return;
        }


        totalBytes +=
            packet.length;
    }


    /*
     * Original file size MUST match.
     */

    if (
        totalBytes !==
        transfer.fileSize
    ) {

        completedFileBlob =
            null;


        downloadButton.disabled =
            true;


        setStatus(
            "File verification failed.\n\n" +
            "Expected: " +
            transfer.fileSize +
            " bytes\n" +
            "Reconstructed: " +
            totalBytes +
            " bytes\n\n" +
            "Keep the receiver scanning and " +
            "restart the sender."
        );


        return;
    }


    /*
     * Reconstruct in packet order.
     */

    const output =
        new Uint8Array(
            totalBytes
        );


    let offset = 0;


    for (
        let i = 0;
        i < transfer.totalPackets;
        i++
    ) {

        const packet =
            packets.get(i);


        output.set(
            packet,
            offset
        );


        offset +=
            packet.length;
    }


    /*
     * Create final Blob.
     */

    completedFileBlob =
        new Blob(
            [output],
            {
                type:
                    "application/octet-stream"
            }
        );


    completedFileName =
        transfer.filename;


    /*
     * Verify Blob size as an additional
     * final check.
     */

    if (
        completedFileBlob.size !==
        transfer.fileSize
    ) {

        completedFileBlob =
            null;

        downloadButton.disabled =
            true;

        showError(
            "Final file verification failed."
        );

        return;
    }


    /*
     * Everything is correct.

     * NOW enable download.
     */

    progressBar.style.width =
        "100%";

    percentElement.textContent =
        "100%";

    receivedElement.textContent =
        transfer.totalPackets;

    missingElement.textContent =
        "0";


    missingBox.textContent =
        "✓ No missing packets.";


    downloadButton.disabled =
        false;


    statusElement.className =
        "status ok";


    statusElement.textContent =
        "✓ TRANSFER COMPLETE\n\n" +
        "Transfer ID: " +
        transfer.id +
        "\n\n" +
        transfer.filename +
        "\n\n" +
        formatBytes(
            transfer.fileSize
        ) +
        "\n\n" +
        "All packets received and file verified.\n" +
        "Download is now available.";
}


/* =====================================================
   DOWNLOAD
===================================================== */

downloadButton.addEventListener(
    "click",
    downloadFile
);


function downloadFile() {

    if (
        !completedFileBlob ||
        !completedFileName
    ) {

        return;
    }


    const url =
        URL.createObjectURL(
            completedFileBlob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        completedFileName;


    link.style.display =
        "none";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    /*
     * Keep URL alive for Safari/iOS.
     */

    setTimeout(
        function() {

            URL.revokeObjectURL(
                url
            );

        },
        60000
    );
}


/* =====================================================
   STOP CAMERA
===================================================== */

stopButton.addEventListener(
    "click",
    stopCamera
);


function stopCamera() {

    scanning = false;


    if (animationFrame) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;
    }


    if (stream) {

        stream
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();
                }
            );


        stream = null;
    }


    video.srcObject =
        null;


    startButton.disabled =
        false;


    stopButton.disabled =
        true;


    setStatus(
        "Camera stopped.\n\n" +
        "Received packets are still stored.\n\n" +
        "You can start the camera again to continue."
    );
}


/* =====================================================
   BASE64 → BYTES
===================================================== */

function base64ToBytes(
    base64
) {

    const binary =
        atob(base64);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);
    }


    return bytes;
}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
    message
) {

    statusElement.className =
        "status";

    statusElement.textContent =
        message;
}


function showError(
    message
) {

    statusElement.className =
        "status error";

    statusElement.textContent =
        "❌ " + message;

    console.error(
        message
    );
}


/* =====================================================
   FILE SIZE
===================================================== */

function formatBytes(
    bytes
) {

    if (
        bytes === 0
    ) {

        return "0 B";
    }


    if (
        bytes < 1024
    ) {

        return bytes + " B";
    }


    if (
        bytes <
        1024 * 1024
    ) {

        return (
            bytes / 1024
        ).toFixed(1) +
        " KB";
    }


    if (
        bytes <
        1024 *
        1024 *
        1024
    ) {

        return (
            bytes /
            1024 /
            1024
        ).toFixed(2) +
        " MB";
    }


    return (
        bytes /
        1024 /
        1024 /
        1024
    ).toFixed(2) +
    " GB";
}
