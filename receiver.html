<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Offline QR File Receiver</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #08111f;
    color: #f8fafc;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

.app {
    width: min(900px, 100%);
    margin: 0 auto;
    padding:
        max(12px, env(safe-area-inset-top))
        12px
        max(20px, env(safe-area-inset-bottom));
}

.card {
    background: #111c2e;
    border: 1px solid #263750;
    border-radius: 18px;
    padding: 18px;
}

h1 {
    margin: 0;
    text-align: center;
    font-size: clamp(22px, 6vw, 32px);
}

.subtitle {
    margin: 8px 0 18px;
    text-align: center;
    color: #94a3b8;
    font-size: 14px;
}

.camera-section {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.camera-box {
    position: relative;
    width: min(720px, 100%);
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    border: 2px solid #334155;
}

#video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    background: #000;
}

#canvas {
    display: none;
}

.scan-guide {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 62%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border: 3px solid rgba(34, 197, 94, 0.9);
    border-radius: 14px;
    pointer-events: none;
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.25);
}

.camera-message {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 10px;
    padding: 9px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.65);
    color: white;
    text-align: center;
    font-size: 13px;
    pointer-events: none;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 12px 18px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button.stop {
    background: #dc2626;
}

button.secondary {
    background: #475569;
}

button.download {
    background: #16a34a;
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.status {
    margin-top: 14px;
    padding: 12px;
    background: #0b1525;
    border-radius: 8px;
    text-align: center;
    color: #cbd5e1;
    line-height: 1.45;
    white-space: pre-wrap;
}

.status.success {
    color: #4ade80;
}

.status.error {
    color: #f87171;
}

.status.warning {
    color: #fbbf24;
}

.progress-container {
    margin-top: 14px;
}

.progress {
    width: 100%;
    height: 20px;
    background: #334155;
    border-radius: 20px;
    overflow: hidden;
}

#progressBar {
    width: 0%;
    height: 100%;
    background: #22c55e;
    transition: width 0.15s linear;
}

.progress-text {
    margin-top: 7px;
    text-align: center;
    font-weight: bold;
}

.info {
    margin-top: 14px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.info-box {
    min-width: 0;
    background: #0b1525;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
}

.value {
    display: block;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.label {
    display: block;
    margin-top: 4px;
    color: #94a3b8;
    font-size: 12px;
}

.missing-box {
    margin-top: 14px;
    padding: 14px;
    background: #0b1525;
    border-radius: 10px;
}

.missing-title {
    font-weight: bold;
    margin-bottom: 8px;
}

#missingPackets {
    width: 100%;
    min-height: 90px;
    resize: vertical;
    padding: 10px;
    background: #111c2e;
    color: white;
    border: 1px solid #334155;
    border-radius: 8px;
    font-family: monospace;
    font-size: 13px;
}

.download-area {
    margin-top: 15px;
    text-align: center;
}

#downloadButton {
    background: #16a34a;
    font-size: 16px;
    padding: 14px 25px;
}

@media (max-width: 600px) {

    .card {
        padding: 12px;
        border-radius: 14px;
    }

    .camera-box {
        width: 100%;
        aspect-ratio: 4 / 3;
    }

    .info {
        grid-template-columns: 1fr;
    }

    button {
        flex: 1 1 auto;
    }
}

@media (max-height: 600px) {

    .camera-box {
        width: min(65vh, 720px);
        aspect-ratio: 4 / 3;
    }

    .subtitle {
        margin-bottom: 8px;
    }
}

</style>
</head>

<body>

<div class="app">

<div class="card">

<h1>📥 Offline QR File Receiver</h1>

<p class="subtitle">
Scan QR packets to reconstruct the file
</p>

<div class="camera-section">

<div class="camera-box">

<video
    id="video"
    autoplay
    playsinline
    muted>
</video>

<canvas id="canvas"></canvas>

<div class="scan-guide"></div>

<div
    id="cameraMessage"
    class="camera-message">
Camera stopped
</div>

</div>

<div class="controls">

<button id="startButton">
Start Camera
</button>

<button
    id="stopButton"
    class="stop"
    disabled>
Stop Camera
</button>

</div>

</div>

<div
    id="status"
    class="status">
Press Start Camera.
</div>

<div class="progress-container">

<div class="progress">

<div id="progressBar"></div>

</div>

<div
    id="progressText"
    class="progress-text">
0%
</div>

</div>

<div class="info">

<div class="info-box">

<span
    id="fileName"
    class="value">
—
</span>

<span class="label">
File
</span>

</div>

<div class="info-box">

<span
    id="receivedCount"
    class="value">
0
</span>

<span class="label">
Packets Received
</span>

</div>

<div class="info-box">

<span
    id="totalCount"
    class="value">
—
</span>

<span class="label">
Total Packets
</span>

</div>

</div>

<div class="info">

<div class="info-box">

<span
    id="transferId"
    class="value">
—
</span>

<span class="label">
Transfer ID
</span>

</div>

<div class="info-box">

<span
    id="missingCount"
    class="value">
—
</span>

<span class="label">
Missing
</span>

</div>

<div class="info-box">

<span
    id="fileSize"
    class="value">
—
</span>

<span class="label">
File Size
</span>

</div>

</div>

<div class="missing-box">

<div class="missing-title">
Missing Packet IDs
</div>

<textarea
    id="missingPackets"
    readonly
    placeholder="Missing packets will appear here..."></textarea>

<div class="controls">

<button
    id="copyMissingButton"
    class="secondary"
    disabled>
Copy Missing IDs
</button>

</div>

</div>

<div class="download-area">

<button
    id="downloadButton"
    class="download"
    disabled>
Download File
</button>

</div>

</div>

</div>

<script>

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const startButton =
    document.getElementById("startButton");

const stopButton =
    document.getElementById("stopButton");

const status =
    document.getElementById("status");

const cameraMessage =
    document.getElementById("cameraMessage");

const progressBar =
    document.getElementById("progressBar");

const progressText =
    document.getElementById("progressText");

const fileNameElement =
    document.getElementById("fileName");

const receivedCountElement =
    document.getElementById("receivedCount");

const totalCountElement =
    document.getElementById("totalCount");

const transferIdElement =
    document.getElementById("transferId");

const missingCountElement =
    document.getElementById("missingCount");

const fileSizeElement =
    document.getElementById("fileSize");

const missingPacketsElement =
    document.getElementById("missingPackets");

const copyMissingButton =
    document.getElementById("copyMissingButton");

const downloadButton =
    document.getElementById("downloadButton");


let stream = null;
let scanning = false;
let animationFrame = null;

const ctx =
    canvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );


let activeTransferId = null;
let totalPackets = 0;
let expectedFileSize = 0;
let expectedFileName = "";

let packets = new Map();
let packetChecksums = new Map();

let fileReady = false;


startButton.addEventListener(
    "click",
    startCamera
);


async function startCamera() {

    stopCamera();

    status.className = "status";

    status.textContent =
        "Starting rear camera...";

    cameraMessage.textContent =
        "Starting camera...";

    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {
            throw new Error(
                "Camera API is not available. Use HTTPS and a supported browser."
            );
        }

        stream =
            await navigator.mediaDevices.getUserMedia(
                {
                    video: {
                        facingMode: {
                            ideal: "environment"
                        },
                        width: {
                            ideal: 1280
                        },
                        height: {
                            ideal: 720
                        }
                    },
                    audio: false
                }
            );

        video.srcObject =
            stream;

        await video.play();

        scanning = true;

        startButton.disabled = true;
        stopButton.disabled = false;

        cameraMessage.textContent =
            "Point the rear camera at the QR code";

        status.className =
            "status";

        status.textContent =
            "Camera ready. Scan the QR packets.";

        scanLoop();

    }
    catch (error) {

        console.error(error);

        cameraMessage.textContent =
            "Camera error";

        status.className =
            "status error";

        status.textContent =
            "Camera access failed: " +
            error.name +
            " - " +
            error.message;

        startButton.disabled = false;
        stopButton.disabled = true;
    }
}


stopButton.addEventListener(
    "click",
    stopCamera
);


function stopCamera() {

    scanning = false;

    if (animationFrame) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;
    }

    if (stream) {

        stream.getTracks().forEach(
            function(track) {
                track.stop();
            }
        );

        stream = null;
    }

    video.srcObject = null;

    cameraMessage.textContent =
        "Camera stopped";

    startButton.disabled = false;
    stopButton.disabled = true;
}


function scanLoop() {

    if (!scanning) {
        return;
    }

    if (
        video.readyState >=
        HTMLMediaElement.HAVE_ENOUGH_DATA
    ) {

        const width =
            video.videoWidth;

        const height =
            video.videoHeight;

        if (
            width > 0 &&
            height > 0
        ) {

            canvas.width =
                width;

            canvas.height =
                height;

            ctx.drawImage(
                video,
                0,
                0,
                width,
                height
            );

            const imageData =
                ctx.getImageData(
                    0,
                    0,
                    width,
                    height
                );

            if (
                typeof jsQR ===
                "function"
            ) {

                const code =
                    jsQR(
                        imageData.data,
                        imageData.width,
                        imageData.height,
                        {
                            inversionAttempts:
                                "attemptBoth"
                        }
                    );

                if (
                    code &&
                    code.data
                ) {

                    processQR(
                        code.data
                    );
                }
            }
        }
    }

    animationFrame =
        requestAnimationFrame(
            scanLoop
        );
}


function processQR(text) {

    const parts =
        text.split("|");

    if (
        parts.length < 9
    ) {
        return;
    }

    if (
        parts[0] !== "QRF4"
    ) {
        return;
    }

    const incomingTransferId =
        parts[1];

    const packetId =
        Number(parts[2]);

    const incomingTotal =
        Number(parts[3]);

    const incomingFileSize =
        Number(parts[4]);

    let incomingFileName;

    try {

        incomingFileName =
            decodeURIComponent(
                parts[5]
            );

    }
    catch(error) {

        return;
    }

    const payloadSize =
        Number(parts[6]);

    const checksum =
        parts[7];

    const base64 =
        parts.slice(8).join("|");

    if (
        !Number.isInteger(packetId) ||
        !Number.isInteger(incomingTotal) ||
        packetId < 0 ||
        packetId >= incomingTotal
    ) {
        return;
    }

    if (
        incomingTotal <= 0
    ) {
        return;
    }

    if (
        activeTransferId === null
    ) {

        beginTransfer(
            incomingTransferId,
            incomingTotal,
            incomingFileSize,
            incomingFileName
        );
    }

    if (
        incomingTransferId !==
        activeTransferId
    ) {
        return;
    }

    if (
        incomingTotal !==
        totalPackets
    ) {
        return;
    }

    if (
        packets.has(packetId)
    ) {
        return;
    }

    let bytes;

    try {

        bytes =
            base64ToBytes(
                base64
            );

    }
    catch(error) {

        return;
    }

    if (
        bytes.length !==
        payloadSize
    ) {
        return;
    }

    const calculated =
        crc32(bytes);

    if (
        calculated !== checksum
    ) {
        return;
    }

    packets.set(
        packetId,
        bytes
    );

    packetChecksums.set(
        packetId,
        checksum
    );

    updateProgress();

    if (
        packets.size ===
        totalPackets
    ) {

        completeTransfer();
    }
}


function beginTransfer(
    id,
    total,
    size,
    name
) {

    activeTransferId = id;

    totalPackets = total;

    expectedFileSize = size;

    expectedFileName = name;

    packets = new Map();

    packetChecksums = new Map();

    fileReady = false;

    fileNameElement.textContent =
        name;

    totalCountElement.textContent =
        total.toLocaleString();

    transferIdElement.textContent =
        id;

    fileSizeElement.textContent =
        formatBytes(size);

    downloadButton.disabled =
        true;

    status.className =
        "status";

    status.textContent =
        "Receiving transfer " +
        id +
        "...";

    updateProgress();
}


function updateProgress() {

    const received =
        packets.size;

    const percentage =
        totalPackets > 0
            ? (
                received /
                totalPackets
            ) * 100
            : 0;

    const missing =
        Math.max(
            0,
            totalPackets -
            received
        );

    receivedCountElement.textContent =
        received.toLocaleString();

    missingCountElement.textContent =
        missing.toLocaleString();

    progressBar.style.width =
        percentage + "%";

    progressText.textContent =
        Math.floor(
            percentage
        ) + "%";

    if (
        totalPackets > 0
    ) {

        const missingIds = [];

        for (
            let i = 0;
            i < totalPackets;
            i++
        ) {

            if (
                !packets.has(i)
            ) {

                missingIds.push(i);
            }
        }

        missingPacketsElement.value =
            compressRanges(
                missingIds
            );

        copyMissingButton.disabled =
            missingIds.length === 0;
    }
}


function completeTransfer() {

    for (
        let i = 0;
        i < totalPackets;
        i++
    ) {

        if (
            !packets.has(i)
        ) {
            return;
        }
    }

    fileReady = true;

    progressBar.style.width =
        "100%";

    progressText.textContent =
        "100%";

    missingCountElement.textContent =
        "0";

    missingPacketsElement.value =
        "";

    copyMissingButton.disabled =
        true;

    downloadButton.disabled =
        false;

    status.className =
        "status success";

    status.textContent =
        "Transfer complete.\n\n" +
        "All " +
        totalPackets +
        " packets received.\n\n" +
        "The file is ready to download.";
}


downloadButton.addEventListener(
    "click",
    downloadFile
);


function downloadFile() {

    if (!fileReady) {
        return;
    }

    const ordered = [];

    for (
        let i = 0;
        i < totalPackets;
        i++
    ) {

        ordered.push(
            packets.get(i)
        );
    }

    const blob =
        new Blob(
            ordered,
            {
                type:
                    "application/octet-stream"
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const link =
        document.createElement(
            "a"
        );

    link.href = url;

    link.download =
        expectedFileName ||
        "received-file";

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();

    setTimeout(
        function() {

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );
}


copyMissingButton.addEventListener(
    "click",
    async function() {

        const value =
            missingPacketsElement.value;

        if (!value) {
            return;
        }

        try {

            await navigator.clipboard.writeText(
                value
            );

            status.textContent =
                "Missing packet IDs copied.";

        }
        catch(error) {

            missingPacketsElement.focus();

            missingPacketsElement.select();
        }
    }
);


function base64ToBytes(base64) {

    const binary =
        atob(base64);

    const bytes =
        new Uint8Array(
            binary.length
        );

    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);
    }

    return bytes;
}


function crc32(bytes) {

    let crc =
        0xFFFFFFFF;

    for (
        let i = 0;
        i < bytes.length;
        i++
    ) {

        crc ^=
            bytes[i];

        for (
            let j = 0;
            j < 8;
            j++
        ) {

            const mask =
                -(crc & 1);

            crc =
                (
                    crc >>> 1
                ) ^
                (
                    0xEDB88320 &
                    mask
                );
        }
    }

    return (
        (
            crc ^
            0xFFFFFFFF
        ) >>> 0
    )
        .toString(16)
        .toUpperCase()
        .padStart(8, "0");
}


function compressRanges(ids) {

    if (
        ids.length === 0
    ) {
        return "";
    }

    const ranges = [];

    let start =
        ids[0];

    let previous =
        ids[0];

    for (
        let i = 1;
        i < ids.length;
        i++
    ) {

        const current =
            ids[i];

        if (
            current ===
            previous + 1
        ) {

            previous =
                current;

            continue;
        }

        if (
            start === previous
        ) {

            ranges.push(
                String(start)
            );

        }
        else {

            ranges.push(
                start +
                "-" +
                previous
            );
        }

        start =
            current;

        previous =
            current;
    }

    if (
        start === previous
    ) {

        ranges.push(
            String(start)
        );

    }
    else {

        ranges.push(
            start +
            "-" +
            previous
        );
    }

    return ranges.join(",");
}


function formatBytes(bytes) {

    if (
        bytes < 1024
    ) {

        return (
            bytes +
            " B"
        );
    }

    if (
        bytes <
        1024 * 1024
    ) {

        return (
            bytes / 1024
        ).toFixed(1) +
        " KB";
    }

    if (
        bytes <
        1024 *
        1024 *
        1024
    ) {

        return (
            bytes /
            1024 /
            1024
        ).toFixed(2) +
        " MB";
    }

    return (
        bytes /
        1024 /
        1024 /
        1024
    ).toFixed(2) +
    " GB";
}

</script>

<script src="./jsQR.js"></script>

</body>
</html>
